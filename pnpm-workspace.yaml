packages:
  - "apps/*"
  - "packages/*"

# Required for Expo / React Native Android Gradle builds in this monorepo.
# pnpm's default isolated linker hides native tooling from apps/mobile/android.
nodeLinker: hoisted
publicHoistPattern:
  - "@react-native/*"
  - "@react-native-community/*"
  - "react-native"
